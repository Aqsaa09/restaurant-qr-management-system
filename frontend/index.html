<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0e12" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Aura & Embers — Haute Cuisine & Digital Dining</title>
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 30%, #1a202c 0%, #0c0e12 100%);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #fbf9f5;
      ">
        <div style="text-align: center; padding: 20px;">
          <div style="
            width: 48px;
            height: 48px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-top: 2px solid #d4af37;
            border-radius: 50%;
            animation: luxurySpin 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin: 0 auto 24px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
          "></div>
          <h2 style="
            margin: 0;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #f3d299;
          ">AURA & EMBERS</h2>
          <p style="
            margin: 8px 0 0;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9e998f;
          ">Preparing Your Table Experience...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes luxurySpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
