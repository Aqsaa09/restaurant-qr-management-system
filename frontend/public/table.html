<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant QR - Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Welcome to Our Restaurant!</h1>
        <div class="spinner"></div>
        <p>Redirecting you to the menu...</p>
        <p><small>If not redirected automatically, click below:</small></p>
        <a href="/#/table/57c637e4-2fb5-45df-88d3-2350c7e45693" class="btn">📱 View Menu</a>
        <br>
        <a href="/admin/login" class="btn">🔧 Admin Panel</a>
    </div>

    <script>
        // Get table QR code from URL parameters or use default
        const urlParams = new URLSearchParams(window.location.search);
        const tableQRCode = urlParams.get('id') || '57c637e4-2fb5-45df-88d3-2350c7e45693';
        
        // Update the manual link with the correct QR code
        const manualLink = document.querySelector('a[href*="/#/table/"]');
        if (manualLink) {
            manualLink.href = `/#/table/${tableQRCode}`;
        }
        
        // Redirect to hash-based URL after 2 seconds
        setTimeout(() => {
            window.location.href = `/#/table/${tableQRCode}`;
        }, 2000);
        
        // Also try immediate redirect
        if (window.location.hash === '') {
            window.location.href = `/#/table/${tableQRCode}`;
        }
    </script>
</body>
</html>
